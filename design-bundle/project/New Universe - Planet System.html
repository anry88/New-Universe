<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Universe — Planet System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-deep: #050811;
    --bg-panel: #0E1424;
    --bg-elevated: #141B2E;
    --line: rgba(150, 175, 220, 0.10);
    --line-strong: rgba(150, 175, 220, 0.22);
    --text: #E8EDF5;
    --text-dim: #8893AD;
    --text-faint: #545E78;
    --accent: #5BD7FF; /* default cyan, overridden per planet */
    --warn: #F4B84A;
    --pos: #5BFFA9;
    --danger: #FF5A6E;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-body: 'Manrope', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0d15;
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ============================================================
     PHONE FRAME — Telegram mini-app on iPhone-ish, 392x780 device
     ============================================================ */
  .device {
    width: 392px;
    height: 780px;
    border-radius: 36px;
    background: #000;
    padding: 8px;
    box-shadow:
      0 0 0 1.5px #1a1f2e,
      0 0 0 3px #060810,
      0 50px 80px -20px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
  }
  .device-inner {
    width: 100%; height: 100%;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    background: var(--bg-deep);
    display: flex; flex-direction: column;
  }
  /* TG header strip */
  .tg-header {
    height: 56px;
    background: #FFFFFF;
    color: #0E0E10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    flex-shrink: 0;
    border-bottom: 1px solid #E5E5EA;
  }
  .tg-title { font-family: var(--font-body); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .tg-actions { display: flex; align-items: center; gap: 16px; color: #2C2C2E; }
  .tg-actions svg { display: block; }

  .tg-footer {
    height: 36px;
    background: #FFFFFF;
    color: #6E6E73;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border-top: 1px solid #E5E5EA;
    font-family: var(--font-body);
  }

  /* ============================================================
     SCREEN — fills space between TG chrome
     ============================================================ */
  .screen {
    position: relative;
    flex: 1;
    display: flex; flex-direction: column;
    background: var(--bg-deep);
    overflow: hidden;
  }
  .screen-bg {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(91,215,255,0.08), transparent 60%),
      radial-gradient(ellipse 120% 70% at 50% 110%, rgba(91,215,255,0.04), transparent 60%);
  }
  .screen-bg .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen-bg-grad {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 100%);
  }
  .screen-bg-vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 35%, transparent 0%, rgba(0,0,0,0.55) 100%);
  }

  .screen-scroll {
    position: relative;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .screen-scroll::-webkit-scrollbar { display: none; }

  /* ============================================================
     TOP RESOURCE BAR
     ============================================================ */
  .topbar {
    position: relative; z-index: 2;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(14,20,36,0.85), rgba(14,20,36,0.55));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    flex-shrink: 0;
  }
  .topbar-resources {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .rchip {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 7px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(14,20,36,0.6);
  }
  .rchip-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
  .rchip-sym { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.05em; }
  .rchip-amt { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .rchip-meta { display: flex; align-items: center; gap: 5px; }
  .rchip-rate { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.04em; }
  .rchip-rate.pos { color: var(--pos); }
  .rchip-rate.zero { color: var(--text-faint); }
  .rchip-bar { flex: 1; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .rchip-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  /* ============================================================
     PLANET PORTRAIT
     ============================================================ */
  .ph {
    position: relative;
    padding: 28px 20px 18px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .ph-orbit {
    position: relative;
    width: 168px; height: 168px;
    display: grid; place-items: center;
    margin-bottom: 18px;
  }
  .ph-glow {
    position: absolute; inset: -10px;
    border-radius: 50%;
    filter: blur(18px);
    z-index: 0;
  }
  .ph-orbit::before, .ph-orbit::after {
    content: '';
    position: absolute;
    border: 1px dashed rgba(255,255,255,0.14);
    border-radius: 50%;
  }
  .ph-orbit::before { inset: -2px; }
  .ph-orbit::after  { inset: -16px; border-style: dotted; opacity: 0.4; }
  .ph-planet { position: relative; z-index: 1; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.5)); }

  .ph-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .ph-tag .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .ph-name {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 2px 0 8px;
  }
  .ph-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ph-sub b { color: var(--text); font-weight: 600; }
  .ph-sub .sep { color: var(--text-faint); }

  /* ============================================================
     PLANET RAIL
     ============================================================ */
  .rail-wrap {
    padding: 6px 0 20px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: rgba(8, 12, 22, 0.5);
  }
  .rail-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.22em;
    color: var(--text-faint);
    padding: 10px 18px 8px;
  }
  .rail {
    display: flex;
    gap: 12px;
    padding: 0 18px 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    padding: 8px 10px 6px;
    border-radius: 12px;
    border: 1px solid transparent;
    flex-shrink: 0;
    min-width: 70px;
    position: relative;
  }
  .rail-item.active {
    background: rgba(91,215,255,0.06);
    border-color: rgba(91,215,255,0.25);
  }
  .rail-item.active::after {
    content: '';
    position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .rail-orb { width: 50px; height: 50px; display: grid; place-items: center; }
  .rail-name { font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--text); }
  .rail-tag { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.1em; color: var(--text-faint); text-transform: uppercase; }

  /* ============================================================
     SLOTS
     ============================================================ */
  .slots-section { padding: 18px 16px 14px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: var(--text-dim);
  }
  .section-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .slots-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .slot {
    position: relative;
    height: 124px;
    border-radius: 14px;
    padding: 12px 10px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .slot:hover { transform: translateY(-1px); }
  .slot.empty {
    border: 1.4px dashed rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.015);
    color: var(--text-faint);
    justify-content: center;
  }
  .slot-plus { font-size: 20px; font-weight: 300; color: var(--text-faint); margin-bottom: 4px; }
  .slot-empty-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em; color: var(--text-faint); }

  .slot.filled {
    border: 1px solid var(--line-strong);
    background:
      linear-gradient(180deg, rgba(20,27,46,0.95), rgba(14,20,36,0.95));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      0 1px 0 rgba(0,0,0,0.4);
  }
  .slot.filled::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.45;
  }
  .slot-icon {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .slot-name {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .slot-lvl {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
  }
  .lvl-pill {
    font-size: 9.5px;
    color: var(--accent);
    background: rgba(91,215,255,0.1);
    border: 1px solid rgba(91,215,255,0.25);
    padding: 1px 6px;
    border-radius: 100px;
    letter-spacing: 0.04em;
  }
  .lvl-cat { font-size: 8.5px; color: var(--text-faint); letter-spacing: 0.12em; }

  .slot.queued::before {
    background: linear-gradient(90deg, transparent, var(--warn), transparent);
    opacity: 0.7;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { 0%{opacity:0.3} 50%{opacity:0.85} 100%{opacity:0.3} }
  .slot-progress { position: absolute; left: 10px; right: 10px; bottom: 8px; }
  .slot-progress-bar { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .slot-progress-fill { height: 100%; background: var(--warn); border-radius: 2px; }
  .slot-progress-eta { font-family: var(--font-mono); font-size: 9px; color: var(--warn); letter-spacing: 0.06em; margin-top: 3px; }

  /* ============================================================
     QUEUE STRIP (above bottom nav)
     ============================================================ */
  .qstrip {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    background: rgba(14,20,36,0.92);
    backdrop-filter: blur(14px);
  }
  .qstrip-icon {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: rgba(91,215,255,0.1);
    border: 1px solid rgba(91,215,255,0.3);
  }
  .qstrip-body { flex: 1; }
  .qstrip-title { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .qstrip-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
  .qstrip-fill { height: 100%; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent); }
  .qstrip-eta { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 500; letter-spacing: 0.04em; }

  /* ============================================================
     BOTTOM NAV
     ============================================================ */
  .bnav {
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 10px 8px 12px;
    background: rgba(8, 12, 22, 0.95);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .bnav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    padding: 6px 4px 0;
    position: relative;
  }
  .bnav-label {
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.02em;
  }
  .bnav-item.active .bnav-label { color: var(--text); }
  .bnav-mark {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 18px; height: 2px; background: var(--accent);
    border-radius: 0 0 2px 2px;
    box-shadow: 0 0 6px var(--accent);
  }

  /* ============================================================
     CATALOG ARTBOARDS — biome lib + building lib
     ============================================================ */
  .catalog {
    position: relative;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #07101F, #050811);
    color: var(--text);
    padding: 28px 28px;
    overflow-y: auto;
  }
  .catalog-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .catalog-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .catalog-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.18em; }

  .biomes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .biome-card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    background:
      linear-gradient(180deg, rgba(20,27,46,0.9), rgba(8,12,22,0.9));
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    text-align: center;
    position: relative;
  }
  .biome-card .planet { filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4)); }
  .biome-card .b-tag {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; color: var(--accent);
  }
  .biome-card .b-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
  .biome-card .b-bonus { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }

  .buildings {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .bld-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 10px 12px;
    background: rgba(14,20,36,0.7);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
    position: relative;
  }
  .bld-card::before {
    content: ''; position: absolute; top: 0; left: 16px; right: 16px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }
  .bld-card .b-icon {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: rgba(91,215,255,0.04);
    border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .bld-card .b-name { font-family: var(--font-display); font-size: 12px; font-weight: 600; }
  .bld-card .b-cat { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); letter-spacing: 0.14em; }

  /* ============================================================
     THEME: OPERATOR HUD — amber/teal tactical
     ============================================================ */
  .screen.theme-operator {
    --accent: #F4B84A;
    --bg-deep: #06070A;
    background: var(--bg-deep);
  }
  .screen.theme-operator .screen-bg {
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(244,184,74,0.06), transparent 60%);
  }
  .screen.theme-operator .screen-bg::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(244,184,74,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,184,74,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .screen.theme-operator .topbar {
    background: rgba(6,8,14,0.92);
    border-bottom: 1px solid rgba(244,184,74,0.18);
  }
  .screen.theme-operator .ph-name {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .screen.theme-operator .ph-orbit::before { border-color: rgba(244,184,74,0.3); border-style: solid; }
  .screen.theme-operator .ph-orbit::after  { border-color: rgba(244,184,74,0.15); }
  .screen.theme-operator .slot.filled {
    border-radius: 4px;
    border: 1px solid rgba(244,184,74,0.22);
  }
  .screen.theme-operator .slot.empty { border-radius: 4px; }
  .screen.theme-operator .slot-icon { border-radius: 4px; }
  .screen.theme-operator .lvl-pill {
    border-radius: 2px;
    color: var(--warn);
    background: rgba(244,184,74,0.1);
    border-color: rgba(244,184,74,0.35);
  }
  .screen.theme-operator .rail-item.active {
    background: rgba(244,184,74,0.06);
    border-color: rgba(244,184,74,0.3);
    border-radius: 4px;
  }
  .screen.theme-operator .qstrip-icon {
    background: rgba(244,184,74,0.1);
    border-color: rgba(244,184,74,0.4);
    border-radius: 4px;
  }
  .screen.theme-operator .bnav-mark { border-radius: 0; }
  .screen.theme-operator .ph-tag::before {
    content: '['; padding-right: 4px; color: var(--text-faint);
  }
  .screen.theme-operator .ph-tag::after {
    content: ']'; padding-left: 4px; color: var(--text-faint);
  }

  /* ============================================================
     THEME: CARTOGRAPH — light editorial cream
     ============================================================ */
  .screen.theme-carto {
    --accent: #C26B43;
    --bg-deep: #F1ECE0;
    --bg-panel: #ECE5D5;
    --text: #1A1814;
    --text-dim: #6B6356;
    --text-faint: #9C9384;
    --line: rgba(26,24,20,0.10);
    --line-strong: rgba(26,24,20,0.20);
    background: var(--bg-deep);
  }
  .screen.theme-carto .screen-bg { display: none; }
  .screen.theme-carto .screen-scroll { background: var(--bg-deep); }
  .screen.theme-carto .topbar {
    background: rgba(241,236,224,0.96);
    border-bottom: 1px solid var(--line);
  }
  .screen.theme-carto .topbar .rchip {
    background: #FFFFFF;
    border-color: var(--line-strong);
  }
  .screen.theme-carto .ph-name {
    font-family: var(--font-serif);
    font-size: 34px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: #1A1814;
  }
  .screen.theme-carto .ph-orbit::before { border-color: rgba(26,24,20,0.18); }
  .screen.theme-carto .ph-orbit::after  { border-color: rgba(26,24,20,0.10); }
  .screen.theme-carto .ph-planet { filter: drop-shadow(0 14px 24px rgba(26,24,20,0.18)); }
  .screen.theme-carto .rail-wrap {
    background: #E5DEC9;
    border-color: var(--line);
  }
  .screen.theme-carto .rail-item.active {
    background: #FFFFFF;
    border-color: var(--line-strong);
  }
  .screen.theme-carto .slot.filled {
    background: #FFFFFF;
    border-color: var(--line-strong);
  }
  .screen.theme-carto .slot-icon {
    background: #F8F4E8;
    border-color: var(--line);
  }
  .screen.theme-carto .slot.empty {
    border-color: rgba(26,24,20,0.18);
    background: rgba(26,24,20,0.02);
  }
  .screen.theme-carto .lvl-pill {
    color: var(--accent);
    background: rgba(194,107,67,0.1);
    border-color: rgba(194,107,67,0.3);
  }
  .screen.theme-carto .qstrip {
    background: rgba(241,236,224,0.96);

const { DesignCanvas, DCSection, DCArtboard } = window;

/* Telegram chrome — wraps the in-app screen so each artboard reads as a real TMA */
const TGFrame = ({ title = 'New Universe', children, theme = 'atlas' }) => (

/* The screen, themed per artboard */
const ThemedScreen = ({ theme, planetId = 'p1' }) => {
  // The PlanetScreen reads from window-scoped data
  const Screen = window.PlanetScreen;
  return (
    <div className={"screen theme-" + theme} style={{ height: '100%' }}>
      {/* render once with the theme applied via outer class — replicate logic */}
      <ScreenInner theme={theme} planetId={planetId} />
    </div>
  );
};

const ScreenInner = ({ theme, planetId }) => {
  const planets = window.SAMPLE_PLANETS;
  const slots = window.SAMPLE_SLOTS;
  const resources = window.SAMPLE_RESOURCES;
  const planet = planets.find(p => p.id === planetId) || planets[0];
  const accent = window.BIOME_META[planet.biome].accent;
  const used = slots.filter(s => s.type).length;
  const Stars = window.Stars;
  const TopBar = window.TopBar;
  const PlanetPortrait = window.PlanetPortrait;
  const PlanetRail = window.PlanetRail;
  const BuildSlot = window.BuildSlot;
  const QueueStrip = window.QueueStrip;
  const BottomNav = window.BottomNav;
  return (
    <React.Fragment>
      <div className="screen-bg" style={{ '--accent': accent }}>
        {theme !== 'operator' && <Stars density={70} seed={planet.id.charCodeAt(1) || 7} />}
        <div className="screen-bg-grad" />
        {theme === 'atlas' && <div className="screen-bg-vignette" />}
      </div>
      <div style={{ '--accent': accent, position: 'relative', display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
        <TopBar resources={resources} />

          <PlanetPortrait biome={planet.biome} name={planet.name} size={planet.size} slots={planet.slots} slotsUsed={used} />

            <div className="rail-label">HOME SYSTEM · 907b-1</div>
            <PlanetRail planets={planets} current={planet.id} />

          <div className="slots-section">
            <div className="section-head">
              <div className="section-title">INSTALLATIONS</div>
              <div className="section-count">{used}/{planet.slots} slots</div>

            <div className="slots-grid">
              {slots.slice(0, planet.slots).map(s => (
                <BuildSlot key={s.idx} slot={s} biomeAccent={accent} />
              ))}
            </div>
          </div>
          <div style={{ height: 80 }} />
        </div>
        <QueueStrip />
        <BottomNav active="planets" />
      </div>
    </React.Fragment>
  );
};

    rocky: 'Cheap mines · Slow factories',
    ocean: 'Free cooling · Slow build',
    gas_giant: 'Infinite gas · No factories',
    ice: '+10% storage · Low energy',
    volcanic: 'Rare alloys · Eruptions',
    green: 'Fast build · Costly colonize',
    anomaly: 'Unique drops · No colonize',
  };
  return (
    <div className="catalog">
      <div className="catalog-head">
        <div className="catalog-title">Biome library — 7 classes</div>
        <div className="catalog-meta">/ATLAS — STELLAR-FORGE</div>
      </div>
      <div className="biomes">
        {biomes.map(b => {
          const Pl = window.PLANET_BY_BIOME[b];
          const m = window.BIOME_META[b];
          return (
            <div key={b} className="biome-card" style={{ '--accent': m.accent }}>

              <div className="b-bonus">{ex[b]}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

              <div className="b-icon"><Icn size={36} tone="#5BD7FF" /></div>

              <div className="b-cat">{def.cat.toUpperCase()}</div>

      </div>
    </div>
  );
};

    <DCSection id="alt-carto" title="Alt direction · Stellar Cartograph (light editorial — for daylight feeds)">
