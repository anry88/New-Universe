name: Deploy (disabled)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why was this workflow dispatched?
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-disabled
  cancel-in-progress: false

jobs:
  disabled:
    name: Cloud deploy disabled
    runs-on: ubuntu-latest
    steps:
      - name: Stop before any provider deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=Deploy disabled::Deployment is disabled from this repository."
          exit 1
