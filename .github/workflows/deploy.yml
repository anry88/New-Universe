name: Deploy (disabled)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why was this workflow dispatched?
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-disabled
  cancel-in-progress: false

jobs:
  disabled:
    name: Cloud deploy disabled
    runs-on: ubuntu-latest
    steps:
      - name: Stop before any provider deploy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Deploy disabled"
            echo
            echo "GitHub Actions deploys to Fly.io and Cloudflare Pages are disabled while New Universe runs on the Windows Docker host."
            echo
            echo "Current deploy path:"
            echo
            echo '```bash'
            echo 'scripts/deploy-hdc.sh --environment prod'
            echo '```'
            echo
            echo "This workflow intentionally does not check out code, read environment secrets, install flyctl, run wrangler, run migrations, or contact cloud providers."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Deploy disabled::Use scripts/deploy-hdc.sh from the operator machine to deploy to the Windows Docker host. Cloud deploys require an explicit migration back to cloud first."
          exit 1
