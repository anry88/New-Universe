name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis

      - name: Build backend
        run: docker compose build backend

      - name: Backend Lint
        run: docker compose run --rm backend npm run lint

      - name: Backend Type-check
        run: docker compose run --rm backend npm run build

      - name: Backend Migrations
        run: docker compose run --rm backend npm run db:migrate

      - name: Backend Seed
        run: docker compose run --rm backend npm run db:seed

      - name: Backend Test
        run: docker compose run --rm backend npm test

      - name: Build frontend
        run: docker compose --profile frontend build frontend

      - name: Frontend Lint
        run: docker compose --profile frontend run --rm frontend npm run lint

      - name: Frontend Type-check
        run: docker compose --profile frontend run --rm frontend npm run build

      - name: Frontend Test
        run: docker compose --profile frontend run --rm frontend npm test

      - name: Frontend E2E — npm ci
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E (Playwright)
        working-directory: frontend
        run: npm run test:e2e

      - name: Cleanup
        if: always()
        run: docker compose down -v
