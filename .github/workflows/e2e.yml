# Browser E2E (Playwright) — not part of the default PR CI path.
# Triggers: manual run, PR labeled for epic / explicit E2E, or closing an epic issue (label epic:*).
name: E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  issues:
    types: [closed]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(join(github.event.pull_request.labels.*.name, ','), 'run-e2e') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'epic:')
      )) ||
      (github.event_name == 'issues' &&
        contains(join(github.event.issue.labels.*.name, ','), 'epic:'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Issues events have no PR SHA — run browser E2E against the repo default branch (expected after epic merge).
          ref: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
